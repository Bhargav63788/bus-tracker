<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track Bus</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
    #bar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000;
           background: #fff; padding: 8px 18px; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.3); font-size: 15px; }
    #map { height: 100%; width: 100%; }
  </style>
</head>
<body>
  <div id="bar">🚌 Waiting for the bus...</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([20, 0], 2);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const busIcon = L.icon({ iconUrl: "bus.png", iconSize: [40, 40], iconAnchor: [20, 20] });
    let marker = null;
    let accuracyCircle = null;
    let firstFix = true;
    const bar = document.getElementById("bar");

    async function update() {
      try {
        const res = await fetch("/get-location");
        const loc = await res.json();

        if (!loc) {
          bar.textContent = "🚌 Waiting for the conductor to start sharing...";
          return;
        }

        const pos = [loc.lat, loc.lng];
        if (!marker) {
          marker = L.marker(pos, { icon: busIcon }).addTo(map);
        } else {
          marker.setLatLng(pos);
        }

        if (typeof loc.accuracy === "number") {
          if (!accuracyCircle) {
            accuracyCircle = L.circle(pos, { radius: loc.accuracy, color: "#1976d2", fillOpacity: 0.12 }).addTo(map);
          } else {
            accuracyCircle.setLatLng(pos).setRadius(loc.accuracy);
          }
        }

        if (firstFix) { map.setView(pos, 16); firstFix = false; }
        else { map.panTo(pos); }

        const accuracyText = typeof loc.accuracy === "number"
          ? " (accuracy about " + Math.round(loc.accuracy) + " m)"
          : "";
        bar.textContent = "🚌 Live: " + loc.lat.toFixed(5) + ", " + loc.lng.toFixed(5) + accuracyText;
      } catch (e) {
        bar.textContent = "⚠️ Cannot reach server";
      }
    }

    update();
    setInterval(update, 3000);
  </script>
</body>
</html>
