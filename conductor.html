<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conductor - Bus Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 40px 20px; background: #f4f6f8; }
    h1 { margin-bottom: 8px; }
    p { color: #555; }
    button { font-size: 20px; padding: 16px 40px; border: none; border-radius: 10px; color: #fff; background: #1a8f3c; cursor: pointer; margin-top: 20px; }
    button.stop { background: #c62828; }
    #status { margin-top: 30px; font-size: 18px; }
    #coords { margin-top: 10px; font-family: monospace; color: #333; }
  </style>
</head>
<body>
  <h1>🚌 Conductor Panel</h1>
  <p>Press start to share the bus location.</p>
  <button id="toggle">Start Sharing</button>
  <div id="status">Not sharing</div>
  <div id="coords"></div>

  <script>
    let watchId = null;
    const btn = document.getElementById("toggle");
    const statusEl = document.getElementById("status");
    const coordsEl = document.getElementById("coords");

    function sendLocation(lat, lng, accuracy) {
      fetch("/update-location", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lat, lng, accuracy })
      })
        .then((response) => {
          if (!response.ok) throw new Error("Server rejected the location");
          statusEl.textContent = "✅ Sharing location (accuracy about " + Math.round(accuracy) + " m)";
          coordsEl.textContent = lat.toFixed(5) + ", " + lng.toFixed(5);
        })
        .catch((err) => { statusEl.textContent = "⚠️ " + err.message; });
    }

    function start() {
      if (!navigator.geolocation) {
        statusEl.textContent = "Geolocation is not supported on this device";
        return;
      }
      statusEl.textContent = "Getting location...";
      watchId = navigator.geolocation.watchPosition(
        (pos) => sendLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
        (err) => { statusEl.textContent = "⚠️ " + err.message; },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }
      );
      btn.textContent = "Stop Sharing";
      btn.classList.add("stop");
    }

    function stop() {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      btn.textContent = "Start Sharing";
      btn.classList.remove("stop");
      statusEl.textContent = "Not sharing";
      coordsEl.textContent = "";
    }

    btn.addEventListener("click", () => (watchId === null ? start() : stop()));
  </script>
</body>
</html>
